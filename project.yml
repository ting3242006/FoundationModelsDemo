name: MessyNote
options:
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO
targets:
  MessyNote:
    type: application
    platform: iOS
    sources: [MessyNote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.MessyNote
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSContactsUsageDescription: 僅在模型查詢參與者時讀取姓名，以供您確認。
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 查詢行程衝突，並在您確認後加入行事曆。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  MessyNoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MessyNoteTests]
    dependencies:
      - target: MessyNote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.MessyNoteTests
  MessyNoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MessyNoteUITests]
    dependencies:
      - target: MessyNote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.MessyNoteUITests
        TEST_TARGET_NAME: MessyNote
schemes:
  MessyNote:
    build:
      targets:
        MessyNote: all
        MessyNoteTests: [test]
    test:
      targets: [MessyNoteTests]
  MessyNoteCaseCUI:
    build:
      targets:
        MessyNote: all
        MessyNoteUITests: [test]
    test:
      targets: [MessyNoteUITests]
  MessyNoteAcceptanceUI:
    build:
      targets:
        MessyNote: all
        MessyNoteUITests: [test]
    test:
      targets: [MessyNoteUITests]
