<p style="position:absolute;left:128px;top:72px;width:160px;font-size:28px;letter-spacing:6px;color:#c4512f">●●●</p>
<p style="position:absolute;left:1312px;top:72px;width:480px;text-align:right;font-family:'Montserrat', 'Noto Sans TC', Arial, sans-serif;font-size:24px;font-weight:800;color:#c4512f">▲ iOS TECH SHARING</p>
<div style="flex:1;display:flex;flex-direction:column;gap:32px">
<div style="display:flex;flex-direction:column;gap:12px">
<p style="font-size:24px;font-weight:700;letter-spacing:3px;color:#8a2e1c">隱私與誠實</p>
<h2 style="font-family:'Montserrat', 'Noto Sans TC', Arial, sans-serif;font-size:72px;font-weight:800;line-height:1.1;color:#c4512f">不誇大，也不假裝</h2>
</div>
<div style="display:flex;flex-direction:column;border-top:1px solid #c4512f">
<p style="font-size:28px;line-height:1.5;color:#2b1a14;border-bottom:1px solid #e3cdbb;padding:16px 0">沒有第三方 LLM、沒有 backend、沒有 analytics</p>
<p style="font-size:28px;line-height:1.5;color:#2b1a14;border-bottom:1px solid #e3cdbb;padding:16px 0">傳給模型的只有候選姓名和衝突摘要，<span style="color:#6b5446">不送整份行事曆</span></p>
<p style="font-size:28px;line-height:1.5;color:#2b1a14;border-bottom:1px solid #e3cdbb;padding:16px 0">聯絡人、行事曆可能經 iCloud 同步，<span style="color:#8a2e1c">所以不宣稱「資料完全不離開裝置」</span></p>
<p style="font-size:28px;line-height:1.5;color:#2b1a14;border-bottom:1px solid #e3cdbb;padding:16px 0">權限被拒時：草稿保留，衝突顯示<span style="color:#8a2e1c">「未知」</span></p>
</div>
</div>
<img src="/_blob/9f35a3ebe94eaeed5ce237eda8b16283" alt="行事曆權限被拒：顯示未允許讀取行事曆、草稿仍保留，以及未有有效查詢證據、衝突狀態未知" style="width:520px;height:694px;object-fit:contain;border:1px solid #e3cdbb;border-radius:4px">
<aside>隱私這頁的重點是「講話要精準」。模型推論確實全部在裝置上，但聯絡人和行事曆本身是系統資料，可能透過 iCloud 同步，所以 MessyNote 不說「資料永遠不離開裝置」。右邊截圖是行事曆權限被拒的狀況：草稿保留，衝突狀態顯示「未知」，不假裝沒有衝突。</aside>
